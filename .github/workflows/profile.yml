name: Profil-Grafiken

on:
  schedule:
    - cron: "17 3 * * *"   # täglich ~05:17 Uhr deutscher Zeit
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "profile-3d-contrib/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Statistik-Dashboard erzeugen
        continue-on-error: true
        run: python3 scripts/generate_dashboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Paul-Sixt

      - name: 3D-Contribution-Graph erzeugen
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Paul-Sixt

      - name: Snake erzeugen
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Paul-Sixt
          outputs: |
            generated/snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8
            generated/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#2e1065,#5b21b6,#8b5cf6,#c4b5fd

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated profile-3d-contrib
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Profil-Grafiken aktualisieren"
            git pull --rebase
            git push
          fi
