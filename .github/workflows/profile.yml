name: Profile graphics

on:
  schedule:
    - cron: "17 3 * * *"   # daily, ~05:17 German time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
      - "profile-3d-contrib/**"

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate dashboard, Space Invaders, Tetris and repo system
        continue-on-error: true
        run: python3 scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Paul-Sixt

      - name: Generate 3D contribution graph
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Paul-Sixt

      - name: Remove old snake files
        run: rm -f generated/snake.svg generated/snake-dark.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update profile graphics"
            git pull --rebase
            git push
          fi
