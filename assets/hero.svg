<style>
  .blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .b2{animation-duration:21s;animation-direction:alternate-reverse}
  .b3{animation-duration:26s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(140px,-40px) scale(1.25)}100%{transform:translate(-120px,30px) scale(.9)}}
  .star{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .glyph{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:20px;opacity:0;animation:float 9s linear infinite}
  @keyframes float{0%{opacity:0;transform:translateY(30px)}20%{opacity:.35}80%{opacity:.25}100%{opacity:0;transform:translateY(-90px)}}
  .grid line{stroke:#a78bfa;stroke-width:1.2}
  .hl{animation:fall 3.5s cubic-bezier(.55,0,1,.45) infinite}
  @keyframes fall{0%{transform:translateY(0)}100%{transform:translateY(120px)}}
  .run{stroke-dasharray:320 2950;animation:run 9s linear infinite}
  @keyframes run{to{stroke-dashoffset:-3270}}
  .sweep{animation:sweep 6s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-500px) skewX(-20deg)}55%,100%{transform:translateX(1500px) skewX(-20deg)}}
  .gl{opacity:0;animation:glitch 6s steps(1) infinite}
  .gl2{animation-name:glitch2}
  @keyframes glitch{0%,88%,100%{opacity:0;transform:none}89%{opacity:.8;transform:translate(-6px,2px)}91%{opacity:.8;transform:translate(5px,-3px)}93%{opacity:.6;transform:translate(-3px,0)}95%{opacity:0}}
  @keyframes glitch2{0%,88%,100%{opacity:0;transform:none}89%{opacity:.8;transform:translate(6px,-2px)}91%{opacity:.8;transform:translate(-5px,3px)}93%{opacity:.6;transform:translate(4px,1px)}95%{opacity:0}}
  .title{animation:jolt 6s steps(1) infinite}
  @keyframes jolt{0%,88%,95%,100%{transform:none}90%{transform:translateX(3px)}92%{transform:translateX(-2px)}}
  .pulse{animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.7}}
  .sub{animation:rise 1.2s .4s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
